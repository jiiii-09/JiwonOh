<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <!-- iPhone 5s 전체화면 웹앱 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="style.css">

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <title>Jiwon Thermal Card</title>
</head>

<body>

  <!-- 🔥 LEFT overlay - 이름 -->
  <svg id="svg-name"
       xmlns="http://www.w3.org/2000/svg"
       width="500" height="90"
       viewBox="0 0 500 90"
       style="position:fixed; top:20px; left:28px; z-index:9999;">

    <text
          fill="black"
          stroke="white"
          stroke-width="6"
          stroke-linejoin="round"
          stroke-linecap="round"
          paint-order="stroke"
          font-family="BookkGothic"
          font-weight="700">

      <!-- 오지원 (48px) -->
      <tspan x="0" y="60" font-size="48">오지원</tspan>

      <!-- Jiwon Oh (28px) -->
      <tspan dx="8" y="60" font-size="28">Jiwon Oh</tspan>

    </text>
  </svg>


  <!-- 🔥 LEFT overlay - 직업 -->
  <svg id="svg-role"
       xmlns="http://www.w3.org/2000/svg"
       width="500" height="70"
       viewBox="0 0 500 70"
       style="position:fixed; top:65px; left:28px; z-index:9999;">

    <text x="0" y="50"
          fill="black"
          stroke="white"
          stroke-width="5"
          stroke-linejoin="round"
          stroke-linecap="round"
          paint-order="stroke"
          font-family="BookkGothic"
          font-size="28"
          font-weight="700">
      Graphic Designer
    </text>

  </svg>


  <!-- 🔥 RIGHT overlay -->
  <div id="overlay-right">
    <div class="contact outline-text">jiiwonoh@gmail.com</div>
    <div class="contact outline-text">010-8437-9055</div>
    <div class="contact outline-text">@jiiii09_</div>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
